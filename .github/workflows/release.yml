name: Release

# 触发策略：仅在用户在 GitHub UI 创建/发布 Release 时触发构建。
# 之前用 `push: tags: v*` 会在 git push tag 时立即触发，本地打 tag 也会跑 CI。
# 现在要求：先在 GitHub UI 点 "Draft a new release" → 写 notes → "Publish release"，
# workflow 才会跑。这样 CI 不在每次 push 跑 build，符合"release 触发"的语义。
on:
  release:
    types: [published]

jobs:
  release:
    name: Build & Upload Release APK
    runs-on: ubuntu-latest
    # v0.2.1 修复：默认 GITHUB_TOKEN 在部分 repo 配置下无 release 写权限，
    # 显式声明 contents 写权限确保 softprops/action-gh-release@v2 能上传 asset
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
